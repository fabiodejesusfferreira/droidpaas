{{define "content"}}
{{template "app_head" (dict "P" .Data.AppPage "CSRF" .CSRF)}}
{{with .Data}}
<div class="logview" data-log data-src="/apps/{{.App.Name}}/logs/stream">
  {{template "logbar" (dict "Download" (printf "/apps/%s/logs/download" .App.Name))}}
  <pre class="log" tabindex="0" aria-label="{{t "logs.label"}}" data-out></pre>
  <noscript><pre class="log">{{.Initial}}</pre></noscript>
</div>
{{end}}
{{end}}
